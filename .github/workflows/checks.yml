name: checks

on:
  push: {}
  pull_request: {}
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for commit linting
          persist-credentials: false
      - uses: webiny/action-conventional-commits@v1.4.2
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-directories: |
            .bin/
      - run: cargo install cargo-run-bin
      - run: cargo bin makers ci_checks
